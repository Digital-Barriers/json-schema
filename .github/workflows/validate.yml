name: Validate LinkML contracts

on:
  pull_request:
  push:
    branches:
      - develop
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.16"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint and check generated schemas
        run: make check

      - name: Validate generated schemas
        run: uv run scripts/validate_contracts.py --schemas-only
